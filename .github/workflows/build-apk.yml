name: Build release APK

on:
  push:
    branches:
      - claude/vr-file-manager-quest-x6kfmg
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + build-tools (zipalign / apksigner)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      # Keeps the same signing key across CI runs so the app can be
      # reinstalled/updated over the previous build instead of needing an
      # uninstall every time (Android requires matching signatures to update).
      - name: Cache release keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: release.keystore.jks
          key: vrcontroler-release-keystore-v1

      - name: Generate release keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore.jks \
            -alias vrcontroler \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vrcontroler -keypass vrcontroler \
            -dname "CN=VR Controler, OU=Quest, O=Personal, L=NA, ST=NA, C=US"

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Sign + zipalign APK
        run: |
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/vr-controler-aligned.apk"
          SIGNED="app/build/outputs/apk/release/vr-controler-release.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore.jks \
            --ks-pass pass:vrcontroler \
            --key-pass pass:vrcontroler \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify "$SIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-controler-release
          path: app/build/outputs/apk/release/vr-controler-release.apk
          retention-days: 30
