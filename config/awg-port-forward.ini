[network]
# Public VPS interface that owns the internet-facing IPv4 address.
public_interface = eth0

# AmneziaWG interface name on the VPS.
vpn_interface = awg0

# VPN subnet and the gaming PC address inside the AmneziaWG tunnel.
vpn_subnet = 10.66.66.0/24
target_ip = 10.66.66.2

# Keep the VPN and SSH control ports on the VPS itself when using profile = all.
amneziawg_listen_port = 51820
ssh_port = 22
preserve_ssh = true

# Set to true only on a disposable/single-purpose VPS where nftables is enough.
disable_ufw = true

[forwarding]
# gta: TCP 80,443 and UDP 6672,61455-61458
# all: every TCP/UDP port except exclude_* below
# custom: use tcp_ports/udp_ports manually
profile = gta

# Uncomment for custom profile, or to override gta defaults.
# tcp_ports = 80,443
# udp_ports = 6672,61455-61458

# For "all ports open" mode:
# profile = all
# forward_all_tcp = true
# forward_all_udp = true

# Safety exclusions for profile = all.
exclude_tcp_ports = 22
exclude_udp_ports = 51820

[advanced]
table_family = inet
table_name = awg_port_forward
enable_ip_forward = true
masquerade = true
